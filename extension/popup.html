<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
    }
    h3 {
      margin: 0 0 6px 0;
      font-size: 15px;
      color: #1e3a8a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 12px;
      color: #64748b;
      margin: 0 0 14px 0;
      line-height: 1.4;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      color: #059669;
      font-weight: 500;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <h3>🏫 Meridian Asset Assistant</h3>
  <p>Open <code>meridian.myclassboard.com/Home/Inventory</code> and click the button below to open the automation panel.</p>
  <button id="launch-btn">🚀 Launch on This Page</button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
